services:
  relay:
    environment:
      # Do not put production secrets in the compose environment. This overlay
      # reads immutable Docker secret files instead.
      TZ_RELAY_MASTER_KEY: ""
      TZ_RELAY_ADMIN_TOKEN: ""
      TZ_RELAY_MASTER_KEY_FILE: /run/secrets/tz_relay_master_key
      TZ_RELAY_ADMIN_TOKEN_FILE: /run/secrets/tz_relay_admin_token
      AIDSO_TOKEN: ""
      AIDSO_TOKEN_FILE: /run/secrets/aidso_token
    secrets:
      - tz_relay_master_key
      - tz_relay_admin_token
      - aidso_token

secrets:
  tz_relay_master_key:
    file: ${TZ_RELAY_MASTER_KEY_SECRET_FILE:?Set the master-key secret file path}
  tz_relay_admin_token:
    file: ${TZ_RELAY_ADMIN_TOKEN_SECRET_FILE:?Set the admin-token secret file path}
  aidso_token:
    file: ${AIDSO_TOKEN_SECRET_FILE:?Set the AIDSO token secret file path}
