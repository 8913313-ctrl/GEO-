# Production reverse proxy template. Replace relay.example.com, certificate
# paths and the narrow VPN/load-balancer allowlist before enabling it. Terminate
# TLS here and keep the relay listener private; never expose Node directly.
limit_req_zone $binary_remote_addr zone=relay_client_rate:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=relay_admin_rate:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=relay_client_connections:10m;

upstream tongzhuo_relay {
    server 127.0.0.1:43280;
    keepalive 32;
}

server {
    listen 80;
    server_name relay.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers off;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 512k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Node trusts this header only when its TCP peer is listed in
    # TZ_RELAY_TRUSTED_PROXY_ADDRESSES. Do not append an unverified header
    # supplied by a public client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Health is for a local load balancer only. Add the exact LB/VPN address if
    # needed; the safe template deliberately does not allow all RFC1918 ranges.
    location = /health/live {
        allow 127.0.0.1;
        # allow 203.0.113.10; # replace with the real load-balancer address
        deny all;
        proxy_pass http://tongzhuo_relay;
    }
    location = /health/ready {
        allow 127.0.0.1;
        # allow 203.0.113.10; # replace with the real load-balancer address
        deny all;
        proxy_pass http://tongzhuo_relay;
    }

    # Restrict operator APIs to the exact VPN egress or management addresses.
    # The safe template is fail-closed for non-local traffic. Browser sessions
    # use HttpOnly cookies; CLI calls may carry Authorization Bearer credentials.
    location ^~ /api/v1/admin/ {
        allow 127.0.0.1;
        # allow 203.0.113.0/24; # replace with the real VPN egress CIDR
        deny all;
        limit_req zone=relay_admin_rate burst=10 nodelay;
        limit_conn relay_client_connections 5;
        proxy_pass http://tongzhuo_relay;
    }

    # Customer instances can reach only the signed client API.
    location ^~ /client/v1/ {
        limit_req zone=relay_client_rate burst=60 nodelay;
        limit_conn relay_client_connections 20;
        proxy_pass http://tongzhuo_relay;
    }

    # The static operator console is optional; keep it behind the same access
    # policy as the admin API when deployed.
    location / {
        allow 127.0.0.1;
        # allow 203.0.113.0/24; # replace with the real VPN egress CIDR
        deny all;
        limit_req zone=relay_admin_rate burst=10 nodelay;
        proxy_pass http://tongzhuo_relay;
    }
}
