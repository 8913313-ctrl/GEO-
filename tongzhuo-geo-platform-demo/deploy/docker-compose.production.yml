# Production cutover.  Do not run this file until the legacy process that
# currently owns 19080 has been stopped and a restore-tested backup exists.
name: ${TZ_COMPOSE_PROJECT_NAME:-tongzhuo-geo-production}

x-app-build: &app-build
  restart: unless-stopped
  env_file:
    - ../.env

x-common-env: &common-env
  NODE_ENV: production
  TZ_DATA_DIR: /app/data
  TZ_DATABASE_PATH: /app/data/tongzhuo-production.sqlite
  TZ_LOG_DIR: /app/data/logs
  TZ_BACKUP_DIR: /app/data/backups
  TZ_TRUST_PROXY: ${TZ_PRODUCTION_TRUST_PROXY:-0}

services:
  geo-admin:
    <<: *app-build
    # Root is used only by the entrypoint to transfer file-backed Compose
    # secrets into a tmpfs; it immediately execs the application as node.
    user: "0:0"
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      TZ_BIND_HOST: 0.0.0.0
      PORT: 44127
      TZ_COOKIE_SECURE: ${TZ_PRODUCTION_COOKIE_SECURE:-1}
      # These paths are set only inside the backend container.  The actual
      # values arrive as Compose secrets and never enter app.env, the image,
      # browser code, or `docker inspect` environment output.
      TZ_RELAY_CLIENT_SECRET_FILE: /run/tongzhuo-runtime-secrets/tz_relay_client_secret
      TZ_AD_HOC_DIAGNOSTIC_API_TOKEN_FILE: /run/tongzhuo-runtime-secrets/tz_ad_hoc_diagnostic_api_token
    volumes:
      - geo-production-data:/app/data
    tmpfs:
      - /run/tongzhuo-runtime-secrets:rw,noexec,nosuid,nodev,size=1m
    # Keep both credentials off the public site and TLS proxy.  An empty,
    # package-owned placeholder is used until the customer instance is
    # provisioned, so a blank private delivery remains runnable.
    secrets:
      - source: tz_relay_client_secret
        target: tz_relay_client_secret
      - source: tz_ad_hoc_diagnostic_api_token
        target: tz_ad_hoc_diagnostic_api_token
    # The management UI is reachable only through the loopback HTTPS proxy
    # below. It never binds an application port to the public network.
    expose:
      - "44127"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:44127/health/ready >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  geo-admin-tls:
    <<: *app-build
    image: nginx:1.27-alpine
    depends_on:
      geo-admin:
        condition: service_healthy
    ports:
      - "${TZ_PRODUCTION_ADMIN_BIND_ADDRESS:-127.0.0.1}:${TZ_PRODUCTION_ADMIN_PORT:-18183}:8443"
    volumes:
      - ./admin-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - "${TZ_ADMIN_TLS_CERT_HOST_PATH:-/opt/tongzhuo-geo/certs}:/etc/nginx/certs:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/health/ready >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s

  geo-site:
    <<: *app-build
    build:
      context: ..
      dockerfile: deploy/Dockerfile.site
    command: ["node", "site-server.mjs"]
    depends_on:
      geo-admin:
        condition: service_healthy
    environment:
      <<: *common-env
      TZ_SITE_BIND_HOST: 0.0.0.0
      TZ_SITE_PORT: 19080
      TZ_SITE_STATIC_ROOT: /site
      TZ_SITE_BASE_URL: ${TZ_PRODUCTION_SITE_BASE_URL:?Set TZ_PRODUCTION_SITE_BASE_URL in deploy/cutover.env}
      TZ_SITE_WORKSPACE_ID: ${TZ_SITE_WORKSPACE_ID:-default}
    volumes:
      - geo-production-data:/app/data
      - "${TZ_SITE_STATIC_HOST_PATH:-../../demo-company-homepage}:/site:ro"
    # This retains the existing public website port after the old listener is
    # stopped.  Set TZ_PRODUCTION_SITE_BIND_ADDRESS=127.0.0.1 when a host
    # Nginx process is the only public listener.
    ports:
      - "${TZ_PRODUCTION_SITE_BIND_ADDRESS:-0.0.0.0}:${TZ_PRODUCTION_SITE_PORT:-19080}:19080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19080/health/ready >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  geo-production-data:
    name: ${TZ_PRODUCTION_DATA_VOLUME:-tongzhuo-geo-production-data}

secrets:
  # The default files contain only a newline. They deliberately keep the
  # relay and the optional ad-hoc service disabled in a blank delivery.
  # Provisioned installations must set the corresponding absolute host path
  # in shared/cutover.env; do not use an environment variable for the value.
  tz_relay_client_secret:
    file: ${TZ_RELAY_CLIENT_SECRET_HOST_PATH:-./private-delivery/compose-placeholders/relay-client-secret.disabled}
  tz_ad_hoc_diagnostic_api_token:
    file: ${TZ_AD_HOC_DIAGNOSTIC_API_TOKEN_HOST_PATH:-./private-delivery/compose-placeholders/ad-hoc-diagnostic-api-token.disabled}
