server {
    listen 8080;
    server_name _;
    # Browser uploads are split into <=20 MB binary batches. JSON/base64 adds
    # about one third overhead, so 32 MB keeps the intended batch working
    # without exposing an unnecessarily large proxy request surface.
    client_max_body_size 32m;

    location / {
        proxy_pass http://geo-admin:44127;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
