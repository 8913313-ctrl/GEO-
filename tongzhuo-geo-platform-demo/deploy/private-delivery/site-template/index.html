<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>企业官网配置中</title>
  <meta name="description" content="企业官网正在进行私有化部署和资料配置。">
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #172238; background: #f3f6fb; }
    main { width: min(680px, calc(100% - 40px)); padding: 48px; border: 1px solid #e1e7f0; border-radius: 20px; background: #fff; box-shadow: 0 24px 70px rgb(23 34 56 / 8%); }
    small { color: #2368d1; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 16px 0 12px; font-size: clamp(28px, 5vw, 44px); }
    p { margin: 0; color: #667085; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <small>PRIVATE DEPLOYMENT</small>
    <h1>企业官网配置中</h1>
    <p>系统已经就绪。请由企业管理员在后台完成品牌资料、页面、行业资讯栏目和正式域名配置后再对外上线。</p>
  </main>
</body>
</html>
