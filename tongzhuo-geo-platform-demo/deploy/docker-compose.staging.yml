# Staging only.  It deliberately does not bind host port 19080, so the
# currently serving website remains untouched during acceptance testing.
name: tongzhuo-geo-staging

x-app-build: &app-build
  restart: unless-stopped
  env_file:
    - ../.env

x-common-env: &common-env
  NODE_ENV: production
  TZ_DATA_DIR: /app/data
  TZ_DATABASE_PATH: /app/data/tongzhuo-production.sqlite
  TZ_LOG_DIR: /app/data/logs
  TZ_BACKUP_DIR: /app/data/backups
  TZ_TRUST_PROXY: "0"

services:
  geo-admin:
    <<: *app-build
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      TZ_BIND_HOST: 0.0.0.0
      PORT: 44127
      TZ_COOKIE_SECURE: "1"
      # Staging never receives production Relay/ad-hoc credentials and must
      # not create billable central tasks while release acceptance runs.
      TZ_RELAY_BASE_URL: ""
      TZ_RELAY_INSTANCE_ID: ""
      TZ_RELAY_CLIENT_ID: ""
      TZ_RELAY_CLIENT_SECRET: ""
      TZ_RELAY_CLIENT_SECRET_FILE: ""
      TZ_AD_HOC_DIAGNOSTIC_API_TOKEN: ""
      TZ_AD_HOC_DIAGNOSTIC_API_TOKEN_FILE: ""
    volumes:
      - geo-staging-data:/app/data
    ports:
      - "${TZ_STAGING_ADMIN_BIND_ADDRESS:-127.0.0.1}:${TZ_STAGING_ADMIN_PORT:-18183}:44127"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:44127/health/ready >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  geo-site:
    <<: *app-build
    build:
      context: ..
      dockerfile: deploy/Dockerfile.site
    command: ["node", "site-server.mjs"]
    depends_on:
      geo-admin:
        condition: service_healthy
    environment:
      <<: *common-env
      TZ_SITE_BIND_HOST: 0.0.0.0
      TZ_SITE_PORT: 19080
      TZ_SITE_STATIC_ROOT: /site
      TZ_SITE_BASE_URL: ${TZ_STAGING_SITE_BASE_URL:-http://127.0.0.1:18182}
      TZ_SITE_WORKSPACE_ID: ${TZ_SITE_WORKSPACE_ID:-default}
    volumes:
      - geo-staging-data:/app/data
      - "${TZ_SITE_STATIC_HOST_PATH:-../../demo-company-homepage}:/site:ro"
    ports:
      - "${TZ_STAGING_SITE_BIND_ADDRESS:-127.0.0.1}:${TZ_STAGING_SITE_PORT:-18182}:19080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19080/health/ready >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  geo-staging-data:
    name: ${TZ_STAGING_DATA_VOLUME:-tongzhuo-geo-staging-data}
