services:
  tongzhuo-publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: tongzhuo-publisher
    ports:
      - "18181:18181"
    networks:
      - geoflow
    environment:
      PUBLISHER_HOST: 0.0.0.0
      PUBLISHER_PORT: 18181
      BROWSER_HEADLESS: "false"
      BROWSER_CHANNEL: chrome
      PUBLISHER_AUTO_RUN: "true"
    volumes:
      - ./publisher-data:/app/.data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18181/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

networks:
  geoflow:
    external: true
    name: geoflow-laravel-prod_default
