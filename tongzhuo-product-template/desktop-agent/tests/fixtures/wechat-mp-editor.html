<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>WeChat MP Editor Fixture</title>
</head>
<body data-save-state="unsaved" data-publish-state="unpublished">
  <main>
    <button type="button">图文消息</button>
    <input id="title" placeholder="请在这里输入标题">
    <div id="ueditor_0" contenteditable="true" data-placeholder="从这里开始写正文"></div>
    <button id="save-draft" type="button" onclick="document.body.dataset.saveState = 'saved'; document.querySelector('#save-success').hidden = false;">保存为草稿</button>
    <p id="save-success" data-save-result="draft_saved" hidden>草稿保存成功</p>
    <button id="publish-article" type="button" onclick="document.body.dataset.publishState = 'published'; document.querySelector('#publish-success').hidden = false;">发布</button>
    <p id="publish-success" hidden>发布成功</p>
  </main>
</body>
</html>
