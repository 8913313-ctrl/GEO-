<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Short Post Publish Success Fixture</title>
</head>
<body data-publish-state="unpublished">
  <main>
    <div data-testid="tweetTextarea_0" role="textbox" contenteditable="true"></div>
