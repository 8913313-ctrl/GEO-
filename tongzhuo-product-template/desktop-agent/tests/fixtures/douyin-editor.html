<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Douyin Editor Fixture</title>
</head>
<body data-save-state="unsaved" data-publish-state="unpublished">
  <main>
    <input class="title-input" placeholder="输入标题"></input>
    <section class="editor"><div class="zone-container"><div contenteditable="true"></div></div></section>
    
    <button data-e2e="publish" type="button" onclick='document.body.dataset.publishState="published";document.getElementById("publish-success").hidden=false;'>发布</button>
    <p id="publish-success" data-testid="publish-success" hidden>发布成功</p>
  </main>
</body>
</html>
