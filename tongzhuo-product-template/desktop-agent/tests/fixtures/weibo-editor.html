<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Weibo Editor Fixture</title>
</head>
<body data-save-state="unsaved" data-publish-state="unpublished">
  <main>
    <textarea id="Composer_TextArea" placeholder="分享内容"></textarea>
    
    
    <button class="sendbtn" type="button" onclick='document.body.dataset.publishState="published";document.getElementById("publish-success").hidden=false;'>发布</button>
    <p id="publish-success" data-testid="publish-success" hidden>发布成功</p>
  </main>
</body>
</html>
