<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Zhihu Editor Fixture</title>
</head>
<body data-save-state="unsaved" data-publish-state="unpublished">
  <main>
    <textarea placeholder="请输入标题"></textarea>
    <section class="DraftEditor-editorContainer">
      <div contenteditable="true" data-placeholder="请输入正文"></div>
    </section>
    <button id="save-draft" type="button" onclick="document.body.dataset.saveState = 'saved'; document.querySelector('#save-success').hidden = false;">保存草稿</button>
    <p id="save-success" data-save-result="draft_saved" hidden>草稿保存成功</p>
    <button id="publish-article" type="button" onclick="document.body.dataset.publishState = 'submitted'; document.querySelector('#publish-success').hidden = false;">提交审核</button>
    <p id="publish-success" hidden>审核已提交</p>
  </main>
</body>
</html>
