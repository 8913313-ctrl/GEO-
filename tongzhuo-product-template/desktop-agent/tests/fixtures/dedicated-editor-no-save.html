<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Dedicated no-save fixture</title></head>
<body data-publish-state="unpublished">
  <textarea placeholder="请输入标题"></textarea>
  <input id="title" placeholder="请在这里输入标题">
  <div class="article-title"><input placeholder="请输入文章标题"></div>
  <div id="ueditor_0" contenteditable="true" data-placeholder="从这里开始写正文"></div>
  <div class="ProseMirror" contenteditable="true" data-placeholder="请输入正文"></div>
  <button id="publish-article" type="button" onclick="document.body.dataset.publishState='published'; document.querySelector('#publish-success').hidden=false;">发布</button>
  <p id="publish-success" hidden>发布成功</p>
</body>
</html>
